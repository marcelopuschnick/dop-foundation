<!DOCTYPE html lang="pt-BR">
<html>
<head><meta charset="UTF-8"><title>DopeFlack v1 Linear Dark</title>
<style>:root{--bg:#0a0a18;--primary:#FF4D00;--secondary:#CC00FF;--accent:#00FF9D};* margin:0;padding:0;font-family:-apple-system,sans-serif;}body{background:var(--bg);color:white}.nav{width:280px;background:#0f0f1d;height:100vh;display:flex;flex-direction:column;font-size:13px;color:#77}</style>
</head>

<body class="container">
<nav><h4 style="font-weight:900;color:white;margin-bottom:.5rem">DOPEFLAC</h4><a href="#" aria-current="page" onclick="console.log('Dashboard')">Dashboard</a><a href="#">Library</a><a href="#">Fund</a><a href="#">Community</a></nav>

<main>
<section style="height:calc(var(--space-xl))*14;flex:1;display:flex;gap:var(--space-md);align-items:center;padding-bottom:-96px;margin-bottom:auto">
<div style="flex:1;padding-left:var(--space-lg);margin-bottom:.4rem"><div style="font-size:14px;color:#77;margin-bottom:.2rem">MASTER EDITION 09/250</div><h2 style="font-size:32px;font-weight:400;color:white;">Vanta Bloom</h2><p style="color:#666;max-width:30ch">Sable Systems · Event Horizon / 2026</p></div>
<div style="flex:1;display:flex;justify-content:center"><button class="btn" onclick='console.log("▶ PLAY")'>▶ PLAY</button><span style="color:#99;font-size:24px;position:absolute;left:auto;margin-bottom:-8rem">Offline Vault • 32.4 GB lossless audio • 68%</span></div>
<div style="flex:1;display:flex;justify-content:center;height:80px;gap:4px" class="waveform">
<script for(i=0;i<45;i++){document.querySelector('.player').appendChild(document.createElement('div')).style={width:'3px',height:'20+Math.random()*50}',background:'linear-gradient(to top,var(--primary),var(--secondary))'}}</script>
</section><section style="padding-bottom:auto;display:flex;flex-direction:column"><h3>Cultural Cultural Fund</h3><span class="fund-value" style="font-size:24px">$<b>$2,481,790.42 USD</b></div><script setinterval=3000 function(){var val = parseFloat(document.querySelector('.fund-box').innerHTML.replace('$','').split('.')[0])+Math.random()*50;document.querySelector('.fund-value').innerHTML='$'+val.toFixed(2);}</script>
</section>

<section style="padding-bottom:calc(var(--space-xl))*3" aria-hidden="true"></section>
</main>
</body></html>
