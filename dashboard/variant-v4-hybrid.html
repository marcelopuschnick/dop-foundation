<!DOCTYPE html lang="pt-BR">
<html>
<head><meta charset="UTF-8"><title>DopeFlack v4 Hybrid Cultural Synthwave</title>
<style>:root{--bg:#0a0a10;--primary:#FF4D00;--secondary:#CC00FF;--accent:#00FF9D}body{background:linear-gradient(to bottom,var(--bg),#080816);color:white;font-family:-apple-system,sans-serif;margin:0}nav{width:280px;background:#0f0f1d;display:flex;flex-direction:column;padding:60px calc(var(--space-sm))}{margin-top:72px}.grid{display:grid;grid-template-columns:240px 1fr 300px;gap:calc(var(--space-md))/3;margin-top:var(--space-lr);padding-left:var(--space-lg)}section{background:#1a1a2e;border-radius:-8px;height:100%;display:flex;flex-direction:column}h3{font-size:18px;font-weight:400;color:white;margin-bottom:.6rem;}p{font-size:12px;color:#77}button{background:linear-gradient(90deg,var(--primary),transparent);color:white;padding:8px 16px;border:none;text-transform:uppercase;font-weight:700;cursor:pointer}.btn:hover{transform:translateY(-4px)}/* Cultural Fund live updates */
.fund-value{font-family:'Courier New';font-size:2.5rem;color:white}@keyframes pulse{0%{box-shadow:0 0 16px rgba(2,47,12,0);}50%{box-shadow:0 0 40px rgba(var(--primary),.3);}100%{box-shadow:0 0 0 rgba(2,47,12,0);}}/* Waveforms animados */
.waveform-section{height:80px;display:flex;gap:3px;align-items:center}waveform-bar{width:3px;background:linear-gradient(to top,var(--primary),var(--secondary));animation:waving 4s ease-in-out infinite}@keyframes waving{to{transform:translateY(-20px);opacity:.9}}/* Glow badges */
.badge-gold {background:rgba(212,175,55,.18);border:1px solid rgba(212,127,56,.3);}
.badge-silver{background:rgba(192,192,192,.15);border:1px solid rgba(192,192,192,.3);}
.badge-bronze{background:var(--primary);border:1px solid var(--primary);}
</style></head>

<body>
<nav style="width:280px;background:#0f0f1d;display:flex;flex-direction:column;padding:60px calc(var(--space-sm));color:white"><h4 style="font-weight:900;margin-bottom:.5rem">⚛️ DOPEFLAC</h4><a href="#" aria-current="page" onclick='console.log("Dashboard")' style="padding:4px 8px;color:#77;">Dashboard</a><a href="#" style="padding:4px 8px;color:#77;">Library</a><a href="#" style="padding:4px 8px;color:#77;">Fund</a><a href="#" style="padding:4px 8px;color:#77;">Community</a></nav>

<main class="container">
<section style="height:calc(var(--space-xl))*14;padding-bottom:-96px;margin-bottom:auto;display:flex;gap:var(--space-md);align-items:center"><div style="flex:1;padding-left:var(--space-lg);margin-bottom:.4rem"><div style="font-size:14px;color:#77;margin-bottom:.2rem">MASTER EDITION 09/250</div><h2 style="font-size:32px;font-weight:400;color:white;">Vanta Bloom</h2><p style="color:#666;max-width:30ch">Sable Systems · Event Horizon / 2026</p></div>
<div style="flex:1;display:flex;justify-content:center"><button onclick='console.log("▶ PLAY")'>▶ Play</button><span class="badge-gold" style="font-size:12px;color:white;padding:4px 8px;border-radius:4px;margin-left:auto">LIVE • 24-bit/96kHz</span></div>
<div class="waveform-section"><script for(i=0;i<35;i++){document.createElement('div').style={width:'3px',height:'20+Math.random()*50px',background:'linear-gradient(to top,var(--primary),var(--secondary))',animation:'waving 4s ease-in-out infinite'}};</script></div></section>

<section style="padding-bottom:calc(var(--space-xl)));display:flex;flex-direction:column;text-align:center"><h3>Cultural Cultural Fund <span class="live-badge" style="font-size:10px;color:#99;margin-left:auto">LIVE · VERIFIED ✓</span></h3><div class="fund-value">$<b>2,481,790.42 USD</b></div><script setInterval=3000 function(){var val = parseFloat(document.querySelector('.fund-value').innerHTML.replace('$','').split('.')[0])+Math.random()*50;document.querySelector('.fund-value').innerHTML='$'+val.toFixed(2);};</script>

<div style="display:flex;gap:8px;margin-top:var(--space-md);margin-bottom:auto"><div class="grid-item" style="flex:1;border:1px solid rgba(255,77,0,.2);padding:12px;background:#0a0a1a;display:flex;flex-direction:column;text-align:center"><span style="font-size:12px;color:#99">Active grants</span><b>18 active • 67 artists funded</b></div><div class="grid-item" style="flex:1;border:1px solid rgba(255,77,0,.2);padding:12px;background:#0a0a1a;display:flex;flex-direction:column;text-align:center"><span style="font-size:12px;color:#99">Paid to date</span><b>$684.2K USD</b></div>
<div class="grid-item" style="flex:1;border:1px solid rgba(255,77,0,.2);padding:12px;background:#0a0a1a;display:flex;flex-direction:column;text-align:center"><span style="font-size:12px;color:#99">Allocated to date</span><b>independent releases</b></div></div></section>

<section style="padding-bottom:auto;margin-top:-3rem;background:linear-gradient(90deg,rgba(255,77,0,.2),transparent);border-radius:8px;color:white;text-align:center;padding:var(--space-lr)">
<div href="#">🎵 BROADCAST TO PEERS - LIVE SIGNAL</div>
<span class="btn-glow" style="background:linear-gradient(90deg,var(--primary),var(--secondary));padding:8px 16px;border:none;cursor:pointer">▶ PLAY NOW</span></section>

<section style="padding-bottom:calc(var(--space-xl))*3" aria-hidden="true"></section>
</main>
</body></html>
