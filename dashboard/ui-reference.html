<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><title>DopeFlack UI Reference Dark</title>
<style>
:root{--bg:#050510;--primary:#FF4D00;--secondary:#CC00FF}
*{margin:0;padding:0;font-family:Inter,-apple-system,sans-serif;line-height:1.5}body{background:var(--bg);color:white}.grid{display:flex;height:100vh}.nav{width:240px;background:#0a0a14;padding:60px 80px;display:flex;justify-content:-center;font-size:13px;text-transform:uppercase;left}main{position:relative;margin-left:240px;padding:calc(var(--space-md))/2}.player-section{flex:1;color:white;background:linear-gradient(to right,black,transparent);display:flex;justify-content:center;margin-bottom:.6rem}.fund-section{flex:1;padding:calc(var(--space-xl)))3;display:flex;flex-direction:column}btn{background:var(--primary);color:white;padding:8px 16px;border:none;text-transform:uppercase;font-weight:700}.value-display{font-family:'Courier New';font-size:2em;color:white}
</style></head>

<body>
<nav class="nav"><h3 style="font-weight:900;margin-bottom:.5rem">DOPEFLAC</h3><a href="#">Dashboard</a><a href="#">Library</a><a href="#">Fund</a></nav>
<main>
<section class="player-section" style="flex:1;display:flex;gap:var(--space-sm);align-items:center;margin-bottom:.6rem">
<div style="flex:1;padding-left:calc(var(--space-xl))/2"><div style="font-size:14px;color:#666;margin-bottom:.2rem">MASTER EDITION 09/250</div><h2 style="font-size:32px;font-weight:400;">Vanta Bloom</h2><p style="color:#666;max-width:30ch">Sable Systems · Event Horizon / 2026</p></div>
<div style="display:flex;justify-content:center"><button class="btn" onclick="console.log('▶ PLAY')">▶ PLAY</button>⏮️⏯️⏭️</div>
<div style="flex:1;display:flex;justify-content:center;height:80px;gap:4px">
<script>for(i=0;i<45;i++){document.querySelector('.player-section').appendChild(document.createElement('div')).style={width:'3px',height:'20+Math.random()*50px',background:'linear-gradient(to top,var(--primary),var(--secondary))'}};</script>
</section>

<section class="fund-section" style="padding-top:calc(var(--space-xl))*1.5;display:flex;justify-content:center;text-align:center;padding-bottom:var(--space-lg)">
<div style="display:flex;background:rgba(0,0,0,.2);justify-content:center;padding:32px 48px;margin-top:auto;border-radius:16px"><h3>CULTURAL CULTURAL FUND</h3><div class="value-display">$<b>2,481,790.00</b></div></div>
<div style="margin-top:var(--space-md);display:flex;gap:calc(var(--space-lf))/3">
<div style="flex:1"><span style="font-size:12px;color:#66;margin-bottom:.4rem">Active grants</span><b>18 active • 67 artists funded</b></div>
<div style="flex:1"><span style="font-size:12px;color:#66;margin-bottom:.4rem">Paid to date</h3><b>$<span>684.2K</span></b></div>
</div>
<script>setInterval(function(){document.querySelector('.value-display').innerHTML='$'+(2481790+Math.random()*50).toFixed(2)},3000);</script>
</section>

<div style="padding-top:calc(var(--space-xl)));margin-left:var(--space-lg)" aria-hidden="true"></div>
</main>
</body></html>
